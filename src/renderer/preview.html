<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Preview - CodeSnap</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: transparent;
            overflow: hidden;
        }

        .preview-container {
            width: 600px;
            height: 400px;
            background: rgba(30, 30, 30, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 16px;
            box-shadow: 0 24px 64px rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .header {
            padding: 16px;
            background: rgba(50, 50, 50, 0.8);
            border-radius: 16px 16px 0 0;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header button {
            background: none;
            border: none;
            color: #fff;
            cursor: pointer;
            padding: 8px 16px;
            border-radius: 6px;
            transition: background 0.2s;
            font-size: 14px;
        }

        .header button:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .header .title {
            color: #fff;
            font-weight: 600;
            flex: 1;
        }

        .header .close-btn {
            background: #ff5f57;
            color: #fff;
            padding: 4px 12px;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .preview {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: auto;
        }

        .preview img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .loading {
            color: #fff;
            font-size: 14px;
        }

        .actions {
            padding: 16px;
            background: rgba(50, 50, 50, 0.8);
            border-radius: 0 0 16px 16px;
            display: flex;
            gap: 12px;
        }

        .actions button {
            flex: 1;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: #fff;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: background 0.2s;
        }

        .actions button:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .actions button.primary {
            background: #007aff;
        }

        .actions button.primary:hover {
            background: #0066cc;
        }
    </style>
</head>
<body>
    <div class="preview-container">
        <div class="header">
            <span class="title" id="language">Loading...</span>
            <button id="copyBtn">Copy</button>
            <button class="close-btn" id="closeBtn">×</button>
        </div>

        <div class="preview">
            <div class="loading" id="loading">Rendering...</div>
            <img id="previewImage" style="display: none;" />
        </div>

        <div class="actions">
            <button id="saveBtn">Save</button>
            <button id="shareBtn">Share</button>
            <button class="primary" id="editBtn">Edit More...</button>
        </div>
    </div>

    <script>
        let currentImageDataUrl = null;

        // Listen for screenshot data
        window.electronAPI.onScreenshotData(async (data) => {
            const { language, imageDataUrl } = data;
            currentImageDataUrl = imageDataUrl;

            // Update UI
            document.getElementById('language').textContent = language.toUpperCase();
            document.getElementById('loading').style.display = 'none';

            const img = document.getElementById('previewImage');
            img.src = imageDataUrl;
            img.style.display = 'block';
        });

        // Copy to clipboard
        document.getElementById('copyBtn').addEventListener('click', async () => {
            if (currentImageDataUrl) {
                await window.electronAPI.copyToClipboard(currentImageDataUrl);
                showNotification('Copied to clipboard!');
            }
        });

        // Save to file
        document.getElementById('saveBtn').addEventListener('click', () => {
            // TODO: Show save dialog
            console.log('Save clicked');
        });

        // Share
        document.getElementById('shareBtn').addEventListener('click', () => {
            // TODO: Show share sheet
            console.log('Share clicked');
        });

        // Edit
        document.getElementById('editBtn').addEventListener('click', () => {
            // TODO: Open editor window
            console.log('Edit clicked');
        });

        // Close
        document.getElementById('closeBtn').addEventListener('click', () => {
            window.close();
        });

        function showNotification(message) {
            // Simple notification - could be improved
            const btn = document.getElementById('copyBtn');
            const originalText = btn.textContent;
            btn.textContent = '✓ Copied!';
            setTimeout(() => {
                btn.textContent = originalText;
            }, 2000);
        }
    </script>
</body>
</html>
